<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DocSort">
  <!--
    DocSort mark — simple geometric document.
    Transparent background; ink in light mode, chartreuse in dark mode.
  -->
  <style>
    .mark { fill: #231e1e; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #d7d72e; }
    }
  </style>
  <defs>
    <mask id="ds-mask">
      <!-- Document body -->
      <rect x="14" y="8" width="36" height="48" rx="6" fill="white"/>
      <!-- Text line cutouts -->
      <rect x="22" y="20" width="20" height="4.5" rx="2" fill="black"/>
      <rect x="22" y="29.5" width="20" height="4.5" rx="2" fill="black"/>
      <rect x="22" y="39" width="13" height="4.5" rx="2" fill="black"/>
    </mask>
  </defs>
  <rect class="mark" width="64" height="64" mask="url(#ds-mask)"/>
</svg>
