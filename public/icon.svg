<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DocSort">
  <!--
    DocSort app icon — chartreuse tile + solid ink document
    with open text-line cutouts (previous mark aesthetic).
  -->
  <rect width="64" height="64" rx="14" fill="#d7d72e"/>
  <!-- Soft top sheen -->
  <ellipse cx="32" cy="6" rx="34" ry="16" fill="#ffffff" opacity="0.18"/>
  <!-- Document body (ink) -->
  <rect x="14" y="8" width="36" height="48" rx="6" fill="#231e1e"/>
  <!-- Text line cutouts (show tile through) -->
  <rect x="22" y="20" width="20" height="4.5" rx="2" fill="#d7d72e"/>
  <rect x="22" y="29.5" width="20" height="4.5" rx="2" fill="#d7d72e"/>
  <rect x="22" y="39" width="13" height="4.5" rx="2" fill="#d7d72e"/>
</svg>
