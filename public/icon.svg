  <rect width="64" height="64" rx="14" fill="#d7d72e"/>
  <!-- Soft top sheen -->
  <ellipse cx="32" cy="6" rx="34" ry="16" fill="#ffffff" opacity="0.22"/>
  <!-- Document shadow -->
  <rect x="20" y="14" width="28" height="40" rx="4" fill="#231e1e" opacity="0.14"/>
  <!-- Document body -->
  <path d="M18 12h19l11 11v25a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z" fill="#ffffff"/>
  <!-- Folded corner -->
  <path d="M37 12v9a2 2 0 0 0 2 2h9L37 12z" fill="#e4e4df"/>
  <path d="M37 12 48 23h-9a2 2 0 0 1-2-2V12z" fill="#231e1e" opacity="0.1"/>
  <!-- Text lines -->
  <rect x="22" y="30" width="18" height="3.2" rx="1.6" fill="#231e1e"/>
  <rect x="22" y="37.5" width="18" height="3.2" rx="1.6" fill="#231e1e" opacity="0.65"/>
  <rect x="22" y="45" width="11" height="3.2" rx="1.6" fill="#231e1e" opacity="0.4"/>
  <!-- Sort chevron -->
  <path d="M40.5 42.5 43.5 45.5 46.5 42.5" fill="none" stroke="#231e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
